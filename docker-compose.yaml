services:
  cv-mcp:
    build: .
    command: ["serve"]
    restart: unless-stopped
    expose: ["8000", "8001"]
    environment:
      CV_MCP_ROOT: /app
      CV_MCP_PROFILE: /data/profile/career.yaml
      CV_MCP_APPLICATIONS: /data/applications
      CV_MCP_OUTPUT: /data/build
      CV_MCP_FONTS: /data/fonts
      CV_MCP_DOWNLOAD_BASE_URL: ${CV_MCP_DOWNLOAD_BASE_URL:?set download URL}
      CV_MCP_DOWNLOAD_SIGNING_SECRET: ${CV_MCP_DOWNLOAD_SIGNING_SECRET:?set download secret}
    volumes:
      - ${CV_MCP_DATA_DIR:-./data}:/data
    networks: [private]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import socket,urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2); socket.create_connection(('127.0.0.1',8000), timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel-client:
    image: ${TUNNEL_CLIENT_IMAGE:-ghcr.io/openai/tunnel-client:v0.0.14}
    restart: unless-stopped
    command:
      - --control-plane.api-key
      - env:CONTROL_PLANE_API_KEY
    environment:
      CONTROL_PLANE_ORGANIZATION_ID: ${CONTROL_PLANE_ORGANIZATION_ID:?set OpenAI organization id}
      CONTROL_PLANE_TUNNEL_ID: ${CONTROL_PLANE_TUNNEL_ID:?set tunnel id}
      CONTROL_PLANE_API_KEY: ${CONTROL_PLANE_API_KEY:?set tunnel runtime key}
      MCP_SERVER_URL: http://cv-mcp:8000/mcp
    depends_on:
      cv-mcp:
        condition: service_healthy
    networks: [private]

networks:
  private:
    driver: bridge
