name: Deploy to Dokploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: dokploy-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      DOKPLOY_DEPLOY_HOOK_URL: ${{ secrets.DOKPLOY_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
      - name: Trigger Dokploy deployment
        run: |
          test -n "$DOKPLOY_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            --request POST "$DOKPLOY_DEPLOY_HOOK_URL"
